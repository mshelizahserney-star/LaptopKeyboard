name: Build Laptop Keyboard APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract Android project
        run: unzip -q LaptopKeyboard-improved-source.zip -d source

      - name: Build APK
        working-directory: source/LaptopKeyboard
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaptopKeyboard-debug-apk
          path: source/LaptopKeyboard/app/build/outputs/apk/debug/app-debug.apk
